<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>Video Downloader Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        body {
            background-color: #FDFBF7;
            font-family: 'Nunito', sans-serif;
        }

        .card {
            border: 2px solid #333;
            border-radius: 12px;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
        }

        .btn {
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.15s;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-dark {
            background: #333;
            color: #fff;
        }

        .btn-blue {
            background: #B9F0F0;
            color: #333;
        }

        .input-field {
            border: 2px solid #333;
            border-radius: 10px;
            background: #B9F0F0;
        }

        .input-field:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(185, 240, 240, 0.5);
        }

        .select-field {
            border: 2px solid #333;
            border-radius: 8px;
            background: #FFF7AE;
            cursor: pointer;
        }

        .platform-btn {
            display: block;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            border: 2px solid #333;
            transition: all 0.15s;
        }

        .platform-btn:hover {
            transform: translateY(-2px);
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
        }

        @keyframes bounce {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .bounce {
            animation: bounce 0.3s ease-out;
        }
    </style>
</head>

<body class="text-gray-800 antialiased">
    <div class="min-h-screen flex flex-col items-center justify-center px-4 py-6">
        <div class="w-full max-w-lg">

            <!-- Title -->
            <div class="card bg-pink-200 p-4 mb-4 text-center">
                <h1 class="text-xl font-extrabold">🎬 Video Downloader Pro</h1>
                <p class="text-xs text-gray-600">Tải video + Tìm bằng ảnh AI</p>
            </div>

            <!-- Download Form -->
            <div class="card bg-white p-4 mb-4">
                <label class="block text-sm font-semibold mb-1">🔗 Link Video</label>
                <input id="videoUrl" type="text" class="input-field w-full h-10 px-3 text-sm mb-3"
                    placeholder="Dán link video vào đây..." />

                <div class="flex gap-2 mb-3">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold mb-1">📺 Chất lượng</label>
                        <select id="qualitySelect" class="select-field w-full h-8 px-2 text-xs">
                            <option value="best">Cao nhất</option>
                            <option value="1080">1080p</option>
                            <option value="720" selected>720p</option>
                            <option value="480">480p</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-semibold mb-1">📁 Định dạng</label>
                        <select id="formatSelect" class="select-field w-full h-8 px-2 text-xs">
                            <option value="video" selected>Video (MP4)</option>
                            <option value="audio">Audio (MP3)</option>
                        </select>
                    </div>
                </div>

                <button id="downloadBtn" onclick="handleDownload()" class="btn btn-dark w-full h-11 text-sm">
                    <span id="btnText">📥 Tải Xuống</span>
                </button>
                <div id="statusBox" class="hidden mt-2 p-2 rounded-lg text-center text-xs font-medium bounce"></div>
            </div>

            <!-- AI Search -->
            <div class="card bg-yellow-100 p-4 mb-4">
                <div class="text-center mb-3">
                    <h2 class="text-base font-bold">🤖 Tìm Video Bằng Ảnh (AI)</h2>
                    <p class="text-xs text-gray-600">Upload screenshot → AI tìm video!</p>
                </div>

                <label for="imageUpload" class="block w-full cursor-pointer mb-3">
                    <div id="uploadArea"
                        class="border-2 border-dashed border-gray-800 rounded-lg p-3 text-center hover:bg-yellow-200 transition">
                        <div id="uploadPlaceholder">
                            <span class="text-xl">📷</span>
                            <p class="text-sm font-medium">Nhấn để chọn ảnh</p>
                        </div>
                        <div id="uploadPreview" class="hidden">
                            <img id="previewImg" src="" alt="Preview" class="max-h-20 mx-auto rounded-lg">
                            <p id="fileName" class="text-xs mt-1 font-medium"></p>
                        </div>
                    </div>
                </label>
                <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageSelect(event)">

                <button id="aiSearchBtn" onclick="handleAISearch()" class="btn btn-blue w-full h-10 text-sm">
                    <span id="aiSearchText">🔍 Tìm Video</span>
                </button>

                <!-- AI Results - Chỉ tên kênh + tiêu đề -->
                <div id="aiResultBox" class="hidden mt-3 bounce">
                    <div class="bg-white p-3 rounded-lg border-2 border-gray-800 mb-3">
                        <p id="aiUsername" class="text-base font-bold text-blue-600"></p>
                        <p id="aiVideoTitle" class="text-sm text-gray-700"></p>
                    </div>

                    <p class="text-xs font-semibold mb-2">🔍 Tìm video trên:</p>
                    <div class="flex flex-col gap-2">
                        <a id="youtubeSearchLink" href="#" target="_blank" class="platform-btn"
                            style="background:#FF0000;">▶️ YouTube</a>
                        <a id="tiktokSearchLink" href="#" target="_blank" class="platform-btn"
                            style="background:#000;">🎵 TikTok</a>
                        <a id="facebookSearchLink" href="#" target="_blank" class="platform-btn"
                            style="background:#1877F2;">📘 Facebook</a>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="card bg-green-200 p-2 text-center">
                <p class="text-xs font-semibold">Hỗ trợ: YouTube • TikTok • Facebook</p>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function showStatus(msg, isError = false) {
            const box = document.getElementById('statusBox');
            box.classList.remove('hidden', 'bg-green-200', 'bg-red-200');
            box.classList.add(isError ? 'bg-red-200' : 'bg-green-200');
            box.textContent = msg;
        }

        function setBtn(loading, text) {
            document.getElementById('downloadBtn').disabled = loading;
            document.getElementById('btnText').textContent = text;
        }

        function detectPlatform(url) {
            if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';
            if (url.includes('tiktok.com')) return 'tiktok';
            if (url.includes('facebook.com') || url.includes('fb.watch')) return 'facebook';
            return null;
        }

        async function handleDownload() {
            const url = document.getElementById('videoUrl').value.trim();
            const quality = document.getElementById('qualitySelect').value;
            const format = document.getElementById('formatSelect').value;

            if (!url) { showStatus('❌ Vui lòng dán link video!', true); return; }
            const platform = detectPlatform(url);
            if (!platform) { showStatus('❌ Link không hợp lệ!', true); return; }

            setBtn(true, '⏳ Đang tải...');
            showStatus('🔄 Đang xử lý...');

            try {
                const res = await fetch(`/download/${platform}?url=${encodeURIComponent(url)}&quality=${quality}&format=${format}`);
                const contentType = res.headers.get('content-type');

                if (contentType && contentType.includes('application/json')) {
                    const err = await res.json();
                    throw new Error(err.error || 'Không thể tải');
                }

                const blob = await res.blob();
                if (blob.size === 0) throw new Error('Không nhận được dữ liệu');

                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${platform}_${quality}.${format === 'audio' ? 'mp3' : 'mp4'}`;
                a.click();
                URL.revokeObjectURL(a.href);

                setBtn(false, '✅ Thành công!');
                showStatus('🎉 Đã tải xong!');
                setTimeout(() => setBtn(false, '📥 Tải Xuống'), 3000);
            } catch (e) {
                setBtn(false, '❌ Thử lại');
                showStatus('😢 ' + e.message, true);
                setTimeout(() => setBtn(false, '📥 Tải Xuống'), 3000);
            }
        }

        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file || !file.type.startsWith('image/')) return;

            selectedFile = file;
            document.getElementById('uploadPlaceholder').classList.add('hidden');
            document.getElementById('uploadPreview').classList.remove('hidden');
            document.getElementById('fileName').textContent = file.name;

            const reader = new FileReader();
            reader.onload = (ev) => { document.getElementById('previewImg').src = ev.target.result; };
            reader.readAsDataURL(file);
            document.getElementById('aiResultBox').classList.add('hidden');
        }

        async function handleAISearch() {
            if (!selectedFile) { alert('Vui lòng chọn ảnh trước!'); return; }

            const btn = document.getElementById('aiSearchBtn');
            const btnText = document.getElementById('aiSearchText');
            btn.disabled = true;
            btnText.textContent = '⏳ Đang phân tích...';

            try {
                const formData = new FormData();
                formData.append('image', selectedFile);

                const res = await fetch('/ai/search', { method: 'POST', body: formData });
                const result = await res.json();

                if (!result.success) throw new Error(result.error || 'Lỗi AI');

                const data = result.data;

                // Chỉ hiển thị tên kênh + tiêu đề
                document.getElementById('aiUsername').textContent = data.username ? '👤 ' + data.username : '';
                document.getElementById('aiVideoTitle').textContent = data.videoTitle ? '📌 ' + data.videoTitle : data.description;

                document.getElementById('youtubeSearchLink').href = data.youtubeUrl;
                document.getElementById('tiktokSearchLink').href = data.tiktokUrl;
                document.getElementById('facebookSearchLink').href = data.facebookUrl;
                document.getElementById('aiResultBox').classList.remove('hidden');

                btn.disabled = false;
                btnText.textContent = '✅ Hoàn thành!';
                setTimeout(() => { btnText.textContent = '🔍 Tìm Video'; }, 2000);
            } catch (e) {
                btn.disabled = false;
                btnText.textContent = '❌ Lỗi!';
                alert('Lỗi: ' + e.message);
                setTimeout(() => { btnText.textContent = '🔍 Tìm Video'; }, 2000);
            }
        }

        document.getElementById('videoUrl').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleDownload(); });
        document.getElementById('formatSelect').addEventListener('change', (e) => {
            const q = document.getElementById('qualitySelect');
            q.innerHTML = e.target.value === 'audio'
                ? '<option value="320">320kbps</option><option value="192" selected>192kbps</option><option value="128">128kbps</option>'
                : '<option value="best">Cao nhất</option><option value="1080">1080p</option><option value="720" selected>720p</option><option value="480">480p</option>';
        });
    </script>
</body>

</html>
