              "monospace": ["Fira Code", "monospace"] // Fallback or specific monospace use

            borderRadius: {
              "none": "0",
              "scrapbook": "8px", // Slightly rounded corners for "torn paper" effect

              "scrapbook-note": "3px 3px 0px rgba(0,0,0,0.4), 6px 6px 0px rgba(0,0,0,0.1)", // More pronounced, slightly uneven shadow
            }
          },
        },
      }
    </script>

<body class="bg-paper-base font-body text-text-dark antialiased">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="flex flex-1 justify-center px-4 py-5 sm:px-8 md:px-20 lg:px-40">
<div class="layout-content-container flex w-full max-w-[960px] flex-1 flex-col">
<header class="scrapbook-note-base scrapbook-note-yellow relative z-10 flex items-center justify-between whitespace-nowrap px-4 py-3 sm:px-6" style="--rotation: -2deg; --rotation-hover: -4deg; margin-top: 1rem; margin-left: -1rem; margin-bottom: 2rem;">
<div class="flex items-center gap-4 text-text-dark">
<div class="size-6 text-text-dark">
<svg class="icon-scrapbook" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
</svg>
</div>
<h2 class="text-xl font-headline leading-tight tracking-normal text-text-dark">My Memory Catcher</h2>
</div>
<div class="hidden items-center gap-6 md:flex">
<a class="text-sm font-body leading-normal text-text-muted hover:text-text-dark" href="#">How It Works</a>
<a class="text-sm font-body leading-normal text-text-muted hover:text-text-dark" href="#">FAQs</a>
<a class="text-sm font-body leading-normal text-text-muted hover:text-text-dark" href="#">Drop Me a Note</a>
</div>
</header>
<main class="flex flex-1 flex-col items-center py-12 sm:py-20">
<div class="w-full @container">
<div class="@[480px]:p-4">
<div class="relative flex min-h-[480px] flex-col items-center justify-center gap-6 p-4 @[480px]:gap-8">
<div class="scrapbook-note-base scrapbook-note-pink relative z-0 flex flex-col gap-2 p-6 text-center" style="--rotation: 1deg; --rotation-hover: 3deg; margin-top: -3rem; margin-right: -2rem;">
<h1 class="font-headline text-4xl leading-tight tracking-normal text-text-dark @[480px]:text-5xl">
                                            Got a video memory? Jot it down!
                                        </h1>
<h2 class="text-base font-body leading-normal text-text-muted @[480px]:text-lg">
                                            Quickly save those special clips from anywhere!
                                        </h2>
</div>
<label class="scrapbook-note-base scrapbook-note-blue relative z-10 flex h-14 w-full max-w-[580px] flex-col @[480px]:h-16" style="--rotation: -3deg; --rotation-hover: -5deg;">
<div class="flex h-full w-full flex-1 items-stretch">
<div class="flex items-center justify-center border-r-2 border-text-dark bg-note-blue pl-[15px] text-text-muted">
<span class="material-symbols-outlined icon-material">link</span>
</div>
<input class="form-input h-full min-w-0 flex-1 resize-none overflow-hidden border-none bg-note-blue px-2 pl-2 pr-2 text-base font-body leading-normal text-text-dark placeholder:text-text-muted focus:outline-0 focus:ring-0 @[480px]:text-lg" placeholder="Paste your video link here, friend!" value=""/>
<div class="flex items-center justify-center border-l-2 border-text-dark bg-note-blue pr-[7px]">
<button class="scrapbook-note-base h-10 min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden bg-text-dark px-4 text-base font-body leading-normal tracking-normal text-paper-base" style="--rotation: 0deg; --rotation-hover: 0deg; transform: none; border-radius: scrapbook;">
<span class="truncate">Add to Scrapbook!</span>
</button>
</div>
</div>
</label>
</div>
</div>
</div>
<div class="mt-16 w-full max-w-2xl text-center sm:mt-24">
<h4 class="scrapbook-note-base scrapbook-note-green relative z-0 inline-block px-4 py-2 text-sm font-headline uppercase leading-normal tracking-widest text-text-dark" style="--rotation: 2deg; --rotation-hover: 4deg; margin-left: 1rem; margin-bottom: 2rem;">Where the magic happens</h4>
<div class="mt-6 flex flex-wrap items-center justify-center gap-8 px-4 sm:gap-12 md:gap-16">
<div class="flex flex-col items-center gap-2">
<svg aria-hidden="true" class="h-10 w-10" viewBox="0 0 24 24">

</svg>
<span class="text-lg font-body font-semibold text-text-dark">YouTube</span>
</div>
<div class="flex flex-col items-center gap-2">
<svg aria-hidden="true" class="h-10 w-10" viewBox="0 0 24 24">
<path class="icon-scrapbook" d="M12 2.5a9.5 9.5 0 00-6.177 16.634.5.5 0 01-.194.275c-.313.2-.626.401-.94.602-.313.2-.437.35-.437.525 0 .175.125.325.438.525.312.2.625.4.938.6.025.012.05.025.075.037.15.076.3.15.462.226a.5.5 0 01.187.287A9.505 9.505 0 1012 2.5zm1.5-1.125a.5.5 0 01.5.5v10.1a.5.5 0 01-.5.5h-4a.5.5 0 01-.5-.5V1.875a.5.5 0 01.5-.5h4z"></path>
</svg>
<span class="text-lg font-body font-semibold text-text-dark">TikTok</span>
</div>
<div class="flex flex-col items-center gap-2">
<svg aria-hidden="true" class="h-10 w-10" viewBox="0 0 24 24">
<path class="icon-scrapbook" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"></path>
</svg>
<span class="text-lg font-body font-semibold text-text-dark">Facebook</span>
</div>
</div>
</div>
</main>
<footer class="scrapbook-note-base scrapbook-note-yellow relative z-0 flex flex-col gap-6 px-5 py-10 text-center @container" style="--rotation: -1deg; --rotation-hover: -3deg; margin-top: 4rem; margin-right: -1rem;">
<div class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2 @[480px]:flex-row @[480px]:justify-center">
<a class="min-w-40 text-sm font-body leading-normal text-text-muted hover:text-text-dark" href="#">Secret Notes</a>
<a class="min-w-40 text-sm font-body leading-normal text-text-muted hover:text-text-dark" href="#">My Private Journal</a>
</div>
<p class="text-sm font-body leading-normal text-text-muted">© 2024 Memory Catcher. All rights reserved, doodled by hand.</p>
</footer>
</div>
</div>
</div>
</div>
